name: Update BOT FX Rates

# Primary trigger: external cron → workflow_dispatch / repository_dispatch
# (GitHub native schedule is unreliable and kept only as a sparse backup.)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-bot-rates]
  schedule:
    # Backup only (UTC). Taiwan = UTC+8 → 10:30 / 15:30 / 18:30 weekdays.
    - cron: "30 2,7,10 * * 1-5"

permissions:
  contents: write
  actions: read

concurrency:
  group: update-bot-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download BOT CSV and build JSON
        id: download
        run: |
          python scripts/download_bot_rates.py --retention-days 90
          if git diff --quiet -- data/bot-xrt-latest.csv data/bot-xrt-latest.json data/history; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.download.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update Bank of Taiwan FX rates CSV/JSON"
          git push

      - name: Purge jsDelivr cache
        if: steps.download.outputs.changed == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          for file in bot-xrt-latest.csv bot-xrt-latest.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${REPO}@main/data/${file}" || true
            curl -fsS "https://purge.jsdelivr.net/gh/${REPO}/data/${file}" || true
          done
